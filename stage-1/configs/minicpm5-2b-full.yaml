# Full-parameter BF16 SFT configuration: openbmb/MiniCPM5-2B.
#
# MiniCPM5-2B is a text-only LlamaForCausalLM checkpoint, so this model is the
# text-only baseline that Qwen3.5-4B is compared against; no images are ever
# supplied to either model in the first comparable experiment.
inherit: common.yaml

model:
  id: openbmb/MiniCPM5-2B
  # Resolved from the Hub on 2026-09-23; pin the exact commit, never a branch.
  revision: 12a3808a956f869c767195e9266b59c4d21d92e2
  adapter: minicpm5
  loader: unsloth-language-model

environment:
  lock_file: locks/minicpm5-2b.lock
  python_version: "3.12"
